[package]
name = "cvss-web"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
cvss-rs = { path = ".." }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = ["Clipboard", "History", "Navigator", "UrlSearchParams"]
